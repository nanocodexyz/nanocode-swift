name: CI

on:
  push:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  package:
    name: Package and examples
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ffi-release.json') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Swift package
        run: swift build

      - name: Swift package without FFI
        env:
          NANOCODE_WITHOUT_FFI: "1"
        run: |
          swift build --scratch-path output/without-ffi
          test -z "$(find output/without-ffi/artifacts -name '*.xcframework')"

      - name: Console
        run: |
          swift build --package-path Examples/Console
          console="$(swift build --package-path Examples/Console --show-bin-path)/Console"
          output="$("$console" bash 'printf "b\na\n" | sort | tr "\n" " "; echo "{\"n\": 2}" | jq .n; printf abc | sha256sum')"
          printf '%s\n' "$output"
          test "$output" = "$(printf 'a b 2\nba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad  -')"

      - name: C and Python
        run: |
          mkdir -p build/macos
          cp "$(find .build/artifacts -path '*NanocodeFFI.xcframework/macos-*/libnanocode_swift.a' | head -n 1)" build/macos/libnanocode_swift.a
          Examples/C/build.sh
          Examples/Python/build.sh
          python3 -c 'import ctypes, sys; library = ctypes.CDLL(sys.argv[1]); [getattr(library, name) for name in ("nanocode_start", "nanocode_send", "nanocode_stop")]' build/python/libnanocode.dylib

  demo:
    name: Demo (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            scheme: NanocodeDemo-macOS
            destination: generic/platform=macOS
          - platform: iOS Simulator
            scheme: NanocodeDemo-iOS
            destination: generic/platform=iOS Simulator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ffi-release.json') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec Examples/Demo/project.yml

      - name: Build
        env:
          SCHEME: ${{ matrix.scheme }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          xcodebuild build -project Examples/Demo/NanocodeDemo.xcodeproj -scheme "$SCHEME" -destination "$DESTINATION" \
            -derivedDataPath output/DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO

  rust:
    name: Rust crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: nanocode-swift
          persist-credentials: false

      - name: SDK revision
        id: sdk
        run: echo "revision=$(jq -r .revision nanocode-swift/sdk-revision.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanocodexyz/nanocode
          ref: ${{ steps.sdk.outputs.revision }}
          path: nanocodex
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            nanocode-swift/target
          key: cargo-${{ runner.os }}-${{ hashFiles('nanocode-swift/Cargo.lock', 'nanocode-swift/sdk-revision.json', 'nanocode-swift/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check
        working-directory: nanocode-swift
        run: cargo check --locked --config 'build.rustc-wrapper=""'

  gate:
    name: CI Gate
    if: always()
    needs: [package, demo, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done
