[package]
name = "nanocode-swift"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nanocodexyz/nanocode-swift"
publish = false
autotests = false
autobenches = false

[lib]
name = "nanocode_swift"
crate-type = ["staticlib"]
test = false
doctest = false
bench = false

[dependencies]
nanocode = { path = "../nanocodex/crates/nanocode", default-features = false, features = ["local-cells"] }
nanocode-code-mode = { path = "../nanocodex/crates/runtime/code-mode" }
nanocode-sync = { path = "../nanocodex/crates/core/sync" }
nanocode-process-contracts = { path = "../nanocodex/crates/core/process" }
nanocode-tool-runtime = { path = "../nanocodex/crates/integrations/tool-runtime" }
nanocode-mcp = { path = "../nanocodex/crates/core/mcp" }
nanocode-mcp-tools = { path = "../nanocodex/crates/integrations/mcp-tools" }
nanocode-http = { path = "../nanocodex/crates/core/http" }
nanocode-python = { path = "../nanocodex/crates/core/python" }
mpp = { version = "0.17.1", default-features = false, features = ["client", "tempo", "sqlite", "reqwest-rustls-tls-no-provider"] }
async-trait = "0.1.89"
base64 = "0.22"
flate2 = "1.1.10"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
http = "1.3.1"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
libc = "0.2.186"
rand = "0.9"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rquickjs = "0.14.0"
rusqlite = { version = "0.38", features = ["bundled"] }
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha1 = "0.11.0"
sha2 = "0.10"
tempo-alloy = { version = "1.11.0", default-features = false }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(target_os = "macos")'.dependencies]
nanocode-home = { path = "../nanocodex/crates/core/home" }
nanocode-psh = { path = "../nanocodex/crates/integrations/psh" }
nanocode-psh-embedded = { path = "../nanocodex/crates/integrations/psh-embedded" }
psh = { path = "../nanocodex/crates/patches/psh/crates/psh" }

[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.14.0", features = ["bindgen"] }

[patch.crates-io]
pymath = { path = "../nanocodex/crates/patches/pymath" }
rustpython-codegen = { path = "../nanocodex/crates/patches/rustpython-codegen" }
rustpython-common = { path = "../nanocodex/crates/patches/rustpython-common" }
rustpython-compiler = { path = "../nanocodex/crates/patches/rustpython-compiler" }
rustpython-compiler-core = { path = "../nanocodex/crates/patches/rustpython-compiler-core" }
rustpython-derive = { path = "../nanocodex/crates/patches/rustpython-derive" }
rustpython-derive-impl = { path = "../nanocodex/crates/patches/rustpython-derive-impl" }
rustpython-doc = { path = "../nanocodex/crates/patches/rustpython-doc" }
rustpython-host_env = { path = "../nanocodex/crates/patches/rustpython-host_env" }
rustpython-literal = { path = "../nanocodex/crates/patches/rustpython-literal" }
rustpython-pylib = { path = "../nanocodex/crates/patches/rustpython-pylib" }
rustpython-ruff_python_ast = { path = "../nanocodex/crates/patches/rustpython-ruff_python_ast" }
rustpython-ruff_python_parser = { path = "../nanocodex/crates/patches/rustpython-ruff_python_parser" }
rustpython-ruff_python_trivia = { path = "../nanocodex/crates/patches/rustpython-ruff_python_trivia" }
rustpython-ruff_source_file = { path = "../nanocodex/crates/patches/rustpython-ruff_source_file" }
rustpython-ruff_text_size = { path = "../nanocodex/crates/patches/rustpython-ruff_text_size" }
rustpython-sre_engine = { path = "../nanocodex/crates/patches/rustpython-sre_engine" }
rustpython-stdlib = { path = "../nanocodex/crates/patches/rustpython-stdlib" }
rustpython-unicode = { path = "../nanocodex/crates/patches/rustpython-unicode" }
rustpython-vm = { path = "../nanocodex/crates/patches/rustpython-vm" }
rustpython-wtf8 = { path = "../nanocodex/crates/patches/rustpython-wtf8" }
unicode-normalization = { path = "../nanocodex/crates/core/unicode-normalization" }

[profile.dev]
debug = false
incremental = true

[profile.release]
opt-level = 3
lto = "off"
codegen-units = 16
panic = "unwind"
strip = "debuginfo"

[profile.release.package.wasmi]
codegen-units = 1

[profile.release.package.wasmi_core]
codegen-units = 1

[profile.release.package.wasmi_ir]
codegen-units = 1

[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dist.package.rquickjs-sys]
opt-level = 3

[profile.dist.package.wasmi]
opt-level = 3

[profile.dist.package.wasmi_core]
opt-level = 3

[profile.dist.package.wasmi_ir]
opt-level = 3

[profile.dist.package.miniz_oxide]
opt-level = 3

[profile.dist.package.sha2]
opt-level = 3
